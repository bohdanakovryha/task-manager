<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg: #EEF0EA;
    --paper: #FFFFFF;
    --ink: #22261F;
    --muted: #767A6E;
    --line: #DADDD1;
    --line-strong: #C3C7B8;

    --todo: #4E6C8C;
    --todo-bg: #E4EAF1;
    --progress: #B07417;
    --progress-bg: #F6EAD4;
    --done: #3E7A50;
    --done-bg: #E2EFE4;

    --high: #B4413B;
    --high-bg: #F6E3E1;
    --medium: #B07417;
    --medium-bg: #F6EAD4;
    --low: #5B7C99;
    --low-bg: #E4EAF1;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 40px 16px 80px;
  }

  .wrap{ max-width: 760px; margin: 0 auto; }

  header{
    margin-bottom: 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
  }

  h1{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin: 0;
  }

  h1 span{ color: var(--muted); font-weight: 400; }

  .ledger-no{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .sync-note{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.03em;
    margin: -14px 0 22px;
  }

  .add-block{
    margin-bottom: 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
  }

  .add-row{ display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  .add-row input[type="text"]{
    flex: 1;
    min-width: 160px;
    padding: 11px 12px;
    border: 1.5px solid var(--line-strong);
    border-radius: 3px;
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-row input[type="time"]{
    padding: 11px 10px;
    border: 1.5px solid var(--line-strong);
    border-radius: 3px;
    background: var(--bg);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }

  .add-row input:focus{ border-color: var(--ink); }
  .add-row input[type="text"]::placeholder{ color: #A6A99C; }

  .add-btn{
    padding: 11px 18px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .add-btn:hover{ opacity: 0.82; }
  .add-btn:active{ transform: scale(0.98); }

  .picker-group{ display: flex; flex-wrap: wrap; gap: 16px; }
  .picker-col{ flex: 1; min-width: 180px; }

  .opt-row{ display: flex; gap: 5px; flex-wrap: wrap; }

  .day-opt, .prio-opt{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    padding: 6px 10px;
    border: 1.5px solid var(--line-strong);
    border-radius: 3px;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
  }

  .day-opt:hover, .prio-opt:hover{ border-color: var(--ink); color: var(--ink); }
  .day-opt.selected{ background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .prio-opt.selected[data-prio="high"]{ background: var(--high); border-color: var(--high); color: var(--paper); }
  .prio-opt.selected[data-prio="medium"]{ background: var(--medium); border-color: var(--medium); color: var(--paper); }
  .prio-opt.selected[data-prio="low"]{ background: var(--low); border-color: var(--low); color: var(--paper); }

  .section-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }

  .day-row{
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .day-chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 8px 10px 7px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.12s;
    position: relative;
    min-width: 56px;
    text-align: left;
  }

  .day-chip:hover{ border-color: var(--line-strong); }
  .day-chip.active{ background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .day-chip.today .day-chip-label::after{ content: '•'; color: var(--progress); margin-left: 4px; }
  .day-chip.today.active .day-chip-label::after{ color: #F6EAD4; }

  .day-chip-bar{
    margin-top: 6px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }

  .day-chip.active .day-chip-bar{ background: rgba(255,255,255,0.25); }

  .day-chip-fill{
    height: 100%;
    background: var(--done);
    border-radius: 2px;
    transition: width 0.2s;
  }

  .day-chip.active .day-chip-fill{ background: var(--paper); }

  .day-chip-frac{
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    display: block;
  }

  .day-chip.active .day-chip-frac{ color: rgba(255,255,255,0.75); }

  .filters{
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .filter-chip{
    background: none;
    border: none;
    padding: 9px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s, border-color 0.15s;
  }

  .filter-chip:hover{ color: var(--ink); }
  .filter-chip.active{ color: var(--ink); border-bottom-color: var(--ink); }

  .filter-chip .count{
    background: var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10.5px;
  }

  .filter-chip.active .count{ background: var(--ink); color: var(--paper); }

  .list{ display: flex; flex-direction: column; gap: 8px; }

  .task{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line-strong);
    border-radius: 3px;
    padding: 12px 12px 12px 14px;
    transition: border-color 0.15s;
    flex-wrap: wrap;
  }

  .task[data-status="todo"]{ border-left-color: var(--todo); }
  .task[data-status="progress"]{ border-left-color: var(--progress); }
  .task[data-status="done"]{ border-left-color: var(--done); }

  .prio-dot{
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .prio-dot[data-prio="high"]{ background: var(--high); }
  .prio-dot[data-prio="medium"]{ background: var(--medium); }
  .prio-dot[data-prio="low"]{ background: var(--low); }

  .task-main{ flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 3px; }

  .task-title{
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .task[data-status="done"] .task-title{
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: #B7BBAC;
  }

  .task-meta{
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
  }

  .task-actions{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .advance-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 7px 12px;
    border-radius: 3px;
    border: 1.5px solid;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  .advance-btn:hover{ opacity: 0.85; }
  .advance-btn.to-progress{ color: var(--todo); border-color: var(--todo); background: var(--todo-bg); }
  .advance-btn.to-done{ color: var(--progress); border-color: var(--progress); background: var(--progress-bg); }

  .stamp{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 2px;
    border: 1.5px solid;
    white-space: nowrap;
    transform: rotate(-2deg);
    flex-shrink: 0;
  }

  .stamp.done{ color: var(--done); border-color: var(--done); background: var(--done-bg); }

  .revert-btn{
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 4px; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .revert-btn:hover{ color: var(--ink); background: var(--bg); }
  .revert-btn svg{ width: 14px; height: 14px; }

  .delete-btn{
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 4px; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; opacity: 0; transition: opacity 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .task:hover .delete-btn{ opacity: 1; }
  .delete-btn:hover{ color: #B4413B; background: #F6E3E1; }
  .delete-btn svg{ width: 14px; height: 14px; }

  .empty{
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .empty .empty-mark{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #B0B4A2;
    display: block;
    margin-bottom: 8px;
  }

  footer{
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  footer p{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin: 0;
  }

  .clear-btn{
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .clear-btn:hover{ color: var(--ink); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Task Ledger <span id="date-label"></span></h1>
    <span class="ledger-no" id="entry-count">0 entries</span>
  </header>
  <p class="sync-note">Saved to this browser (localStorage) &middot; stays on this device</p>

  <div class="add-block">
    <div class="add-row">
      <input type="text" id="task-input" placeholder="Log a new task..." maxlength="140" />
      <input type="time" id="time-input" />
      <button class="add-btn" id="add-btn">+ Add</button>
    </div>
    <div class="picker-group">
      <div class="picker-col">
        <span class="section-label">Day</span>
        <div class="opt-row day-picker" id="day-picker"></div>
      </div>
      <div class="picker-col">
        <span class="section-label">Priority</span>
        <div class="opt-row" id="prio-picker">
          <button class="prio-opt" data-prio="low">Low</button>
          <button class="prio-opt selected" data-prio="medium">Medium</button>
          <button class="prio-opt" data-prio="high">High</button>
        </div>
      </div>
    </div>
  </div>

  <span class="section-label">Progress by day</span>
  <div class="day-row" id="day-row"></div>

  <div class="filters" id="filters">
    <button class="filter-chip active" data-filter="all">All <span class="count" id="count-all">0</span></button>
    <button class="filter-chip" data-filter="todo">To do <span class="count" id="count-todo">0</span></button>
    <button class="filter-chip" data-filter="progress">In progress <span class="count" id="count-progress">0</span></button>
    <button class="filter-chip" data-filter="done">Completed <span class="count" id="count-done">0</span></button>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <p>Forward flow: to do → in progress → completed</p>
    <button class="clear-btn" id="clear-done">Clear completed</button>
  </footer>
</div>

<script>
  const STATUSES = ['todo', 'progress', 'done'];
  const STATUS_LABEL = { todo: 'To do', progress: 'In progress', done: 'Completed' };
  const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
  const PRIORITY_LABEL = { high: 'High', medium: 'Medium', low: 'Low' };
  const DAYS = [
    { key: 'mon', label: 'Mon' },
    { key: 'tue', label: 'Tue' },
    { key: 'wed', label: 'Wed' },
    { key: 'thu', label: 'Thu' },
    { key: 'fri', label: 'Fri' },
    { key: 'sat', label: 'Sat' },
    { key: 'sun', label: 'Sun' },
  ];
  const STORAGE_KEY = 'task-ledger-tasks';

  let tasks = [];
  let nextId = 1;
  let activeStatusFilter = 'all';
  let activeDayFilter = 'any';
  let selectedNewTaskDay = null;
  let selectedNewTaskPriority = 'medium';

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('task-input');
  const timeInputEl = document.getElementById('time-input');
  const addBtn = document.getElementById('add-btn');
  const filtersEl = document.getElementById('filters');
  const dayRowEl = document.getElementById('day-row');
  const dayPickerEl = document.getElementById('day-picker');
  const prioPickerEl = document.getElementById('prio-picker');
  const entryCountEl = document.getElementById('entry-count');
  const dateLabel = document.getElementById('date-label');
  const clearDoneBtn = document.getElementById('clear-done');

  function todayKey(){
    const jsDay = new Date().getDay();
    return ['sun','mon','tue','wed','thu','fri','sat'][jsDay];
  }

  dateLabel.textContent = '— ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  function buildDayPicker(){
    const noneBtn = `<button class="day-opt selected" data-day="">Someday</button>`;
    const dayBtns = DAYS.map(d => `<button class="day-opt" data-day="${d.key}">${d.label}</button>`).join('');
    dayPickerEl.innerHTML = noneBtn + dayBtns;
  }

  function buildDayRow(){
    dayRowEl.innerHTML = `<button class="day-chip active" data-day="any"><span class="day-chip-label">All</span></button>` +
      DAYS.map(d => `<button class="day-chip${d.key === todayKey() ? ' today' : ''}" data-day="${d.key}">
        <span class="day-chip-label">${d.label}</span>
        <span class="day-chip-bar"><span class="day-chip-fill" style="width:0%"></span></span>
        <span class="day-chip-frac">0/0</span>
      </button>`).join('') +
      `<button class="day-chip" data-day="none"><span class="day-chip-label">Someday</span></button>`;
  }

  function loadTasks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        tasks = parsed.tasks || [];
        nextId = parsed.nextId || (tasks.reduce((m, t) => Math.max(m, t.id), 0) + 1);
      }
    } catch(err){
      tasks = [];
      nextId = 1;
    }
    render();
  }

  function saveTasks(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, nextId }));
    } catch(err){
      console.error('Could not save to localStorage', err);
    }
  }

  function addTask(){
    const value = inputEl.value.trim();
    if (!value){
      inputEl.style.borderColor = '#B4413B';
      inputEl.placeholder = 'Enter a task before adding';
      return;
    }
    tasks.unshift({
      id: nextId++,
      title: value,
      status: 'todo',
      day: selectedNewTaskDay,
      time: timeInputEl.value || null,
      priority: selectedNewTaskPriority,
    });
    inputEl.value = '';
    timeInputEl.value = '';
    inputEl.style.borderColor = '';
    render();
    saveTasks();
  }

  function advanceStatus(id){
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const idx = STATUSES.indexOf(t.status);
    if (idx < STATUSES.length - 1) t.status = STATUSES[idx + 1];
    render();
    saveTasks();
  }

  function revertStatus(id){
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const idx = STATUSES.indexOf(t.status);
    if (idx > 0) t.status = STATUSES[idx - 1];
    render();
    saveTasks();
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    render();
    saveTasks();
  }

  function clearCompleted(){
    tasks = tasks.filter(t => t.status !== 'done');
    render();
    saveTasks();
  }

  function setStatusFilter(filter){
    activeStatusFilter = filter;
    render();
  }

  function setDayFilter(day){
    activeDayFilter = day;
    render();
  }

  function revertIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
  }

  function trashIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  }

  function dayLabel(key){
    if (!key) return null;
    const found = DAYS.find(d => d.key === key);
    return found ? found.label : null;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateDayProgress(){
    DAYS.forEach(d => {
      const dayTasks = tasks.filter(t => t.day === d.key);
      const done = dayTasks.filter(t => t.status === 'done').length;
      const total = dayTasks.length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      const chip = dayRowEl.querySelector(`.day-chip[data-day="${d.key}"]`);
      if (!chip) return;
      chip.querySelector('.day-chip-fill').style.width = pct + '%';
      chip.querySelector('.day-chip-frac').textContent = done + '/' + total;
    });
  }

  function sortTasks(list){
    return [...list].sort((a, b) => {
      const pDiff = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
      if (pDiff !== 0) return pDiff;
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return b.id - a.id;
    });
  }

  function render(){
    [...dayPickerEl.querySelectorAll('.day-opt')].forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.day === (selectedNewTaskDay || ''));
    });
    [...prioPickerEl.querySelectorAll('.prio-opt')].forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.prio === selectedNewTaskPriority);
    });
    [...dayRowEl.querySelectorAll('.day-chip')].forEach(btn => {
      btn.classList.toggle('active', btn.dataset.day === activeDayFilter);
    });

    updateDayProgress();

    const counts = { all: tasks.length, todo: 0, progress: 0, done: 0 };
    tasks.forEach(t => counts[t.status]++);
    document.getElementById('count-all').textContent = counts.all;
    document.getElementById('count-todo').textContent = counts.todo;
    document.getElementById('count-progress').textContent = counts.progress;
    document.getElementById('count-done').textContent = counts.done;
    entryCountEl.textContent = counts.all + (counts.all === 1 ? ' entry' : ' entries');

    [...filtersEl.querySelectorAll('.filter-chip')].forEach(chip => {
      chip.classList.toggle('active', chip.dataset.filter === activeStatusFilter);
    });

    let visible = tasks;
    if (activeStatusFilter !== 'all') visible = visible.filter(t => t.status === activeStatusFilter);
    if (activeDayFilter === 'none') visible = visible.filter(t => !t.day);
    else if (activeDayFilter !== 'any') visible = visible.filter(t => t.day === activeDayFilter);
    visible = sortTasks(visible);

    if (visible.length === 0){
      listEl.innerHTML = `
        <div class="empty">
          <span class="empty-mark">Ledger clear</span>
          ${tasks.length === 0 ? 'Add a task above to open the first entry.' : 'No tasks match this view.'}
        </div>`;
      return;
    }

    listEl.innerHTML = visible.map(t => {
      const meta = [];
      if (dayLabel(t.day)) meta.push(dayLabel(t.day));
      if (t.time) meta.push(t.time);

      let actionHtml = '';
      if (t.status === 'todo'){
        actionHtml = `<button class="advance-btn to-progress" data-action="advance" data-id="${t.id}">Start →</button>`;
      } else if (t.status === 'progress'){
        actionHtml = `
          <button class="revert-btn" aria-label="Move back to to do" data-action="revert" data-id="${t.id}">${revertIcon()}</button>
          <button class="advance-btn to-done" data-action="advance" data-id="${t.id}">Complete →</button>`;
      } else {
        actionHtml = `
          <button class="revert-btn" aria-label="Reopen task" data-action="revert" data-id="${t.id}">${revertIcon()}</button>
          <div class="stamp done">Completed</div>`;
      }

      return `
      <div class="task" data-status="${t.status}" data-id="${t.id}">
        <span class="prio-dot" data-prio="${t.priority}" title="${PRIORITY_LABEL[t.priority]} priority"></span>
        <div class="task-main">
          <div class="task-title">${escapeHtml(t.title)}</div>
          ${meta.length ? `<div class="task-meta">${meta.join(' &middot; ')}</div>` : ''}
        </div>
        <div class="task-actions">
          ${actionHtml}
          <button class="delete-btn" aria-label="Delete task" data-action="delete" data-id="${t.id}">${trashIcon()}</button>
        </div>
      </div>`;
    }).join('');
  }

  buildDayPicker();
  buildDayRow();

  addBtn.addEventListener('click', addTask);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  inputEl.addEventListener('input', () => { inputEl.style.borderColor = ''; });

  dayPickerEl.addEventListener('click', e => {
    const btn = e.target.closest('.day-opt');
    if (!btn) return;
    selectedNewTaskDay = btn.dataset.day || null;
    render();
  });

  prioPickerEl.addEventListener('click', e => {
    const btn = e.target.closest('.prio-opt');
    if (!btn) return;
    selectedNewTaskPriority = btn.dataset.prio;
    render();
  });

  dayRowEl.addEventListener('click', e => {
    const btn = e.target.closest('.day-chip');
    if (btn) setDayFilter(btn.dataset.day);
  });

  filtersEl.addEventListener('click', e => {
    const chip = e.target.closest('.filter-chip');
    if (chip) setStatusFilter(chip.dataset.filter);
  });

  listEl.addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (btn.dataset.action === 'advance') advanceStatus(id);
    if (btn.dataset.action === 'revert') revertStatus(id);
    if (btn.dataset.action === 'delete') deleteTask(id);
  });

  clearDoneBtn.addEventListener('click', clearCompleted);

  loadTasks();
</script>

</body>
</html>
